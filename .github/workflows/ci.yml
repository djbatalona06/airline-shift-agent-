name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No browser install in this job: the default suite runs against fixtures,
      # with no network and no portal. If a test ever needs Chromium here,
      # something has started reaching out that shouldn't. The browser-driven
      # tests are a separate tier, marked `e2e` and deselected by default; the
      # job below runs those.
      - name: Test
        run: pytest -q

      - name: Build the demo dashboard
        run: python tools/build_demo.py site/demo

      - name: Check no data placeholder survived
        run: |
          if grep -q '{{DATA}}' site/demo/index.html; then
            echo "template placeholder was not replaced"; exit 1
          fi

  e2e:
    # Drives the real adapter and the real dashboard through Chromium against a
    # fake portal on loopback. Headed under Xvfb, which is the same shape as the
    # VPS deployment - so this doubles as a smoke test for docs/VPS.md.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: End-to-end tests
        run: xvfb-run -a pytest -m e2e -q
