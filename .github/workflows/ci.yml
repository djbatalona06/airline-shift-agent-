name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No browser install: the whole suite runs against fixtures, with no
      # network and no portal. If a test ever needs Chromium here, something
      # has started reaching out that shouldn't.
      - name: Test
        run: pytest -q

      - name: Build the demo dashboard
        run: python tools/build_demo.py site/demo

      - name: Check no data placeholder survived
        run: |
          if grep -q '{{DATA}}' site/demo/index.html; then
            echo "template placeholder was not replaced"; exit 1
          fi
