name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      # Built from the real dashboard code with fabricated data, so the demo
      # cannot drift from what the app renders, and no real roster can ever
      # reach a public page - the generator invents its own data and reads
      # nothing from disk.
      - name: Build demo dashboard
        run: python tools/build_demo.py site/demo

      - name: Fail if the demo did not render
        run: |
          test -s site/demo/index.html
          if grep -q '{{DATA}}' site/demo/index.html; then
            echo "template placeholder was not replaced"; exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
